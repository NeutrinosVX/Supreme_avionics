name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  ground-station:
    name: Ground Station (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_GroundStation
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 03_GroundStation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

      - name: Dependency health
        run: npm audit --omit=dev --audit-level=high
